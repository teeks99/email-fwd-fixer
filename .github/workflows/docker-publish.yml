name: Publish Docker Image

on:
  push:
  schedule:
    - cron: '0 0 * * 0' # Runs at 00:00 every Sunday
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Build and test image (push from main only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Only main publishes (pushes, the Sunday rebuild, manual runs on main).
      # Every other branch, including Dependabot's, just builds and tests.
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to the GitHub Container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            teeks99/email-fwd-fixer
            ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          provenance: false
          tags: email-fwd-fixer:ci
          labels: ${{ steps.meta.outputs.labels }}

      - name: Run unit tests in the image
        run: >-
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1
          -v "$PWD:/src:ro" -w /src email-fwd-fixer:ci
          python -m unittest -v test_email_fixer

      # Same inputs as the build above, so this reuses its cached layers.
      - name: Push Docker image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  keepalive:
    name: Keep the weekly rebuild enabled
    # GitHub disables scheduled workflows in public repos after 60 days without
    # repository activity. If main has been quiet for 45 days, push an empty
    # commit so the Sunday rebuild keeps picking up Python base image updates.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Commit if main has been quiet for 45 days
        run: |
          days=$(( ($(date +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Last commit on main was $days days ago."
          if [ "$days" -lt 45 ]; then
            echo "Recent enough; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Keepalive: keep GitHub from disabling the weekly image rebuild"
          git push origin "HEAD:$GITHUB_REF"
